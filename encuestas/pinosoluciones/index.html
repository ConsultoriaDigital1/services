<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Encuesta — Consultoría Digital</title>
  <link rel="icon" href="../../assets/favicon.png"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../brief/brief.css"><link rel="stylesheet" href="../encuesta.css">
</head>
<body data-encuesta="pinosoluciones">
  <header class="brief-header"><a href="../../"><img src="../../assets/logo-cd.webp" width="190" alt="Consultoría Digital"></a><span id="cliente"></span></header>
  <main class="brief-main">
    <p class="eyebrow">ENCUESTA</p><h1 id="titulo"></h1>
    <p class="lead" id="intro"></p>
    <form id="encuesta-form" novalidate>
      <p class="card enc-aviso" id="ya-enviada" hidden>Ya enviaste esta encuesta. Si cambiás algo y la volvés a enviar, se actualiza la misma respuesta.</p>
      <div class="enc-progreso"><span id="avance"></span><span class="pista"><span id="barra"></span></span></div>
      <div id="secciones"></div>
      <section class="card">
        <label class="field"><span>Tu nombre *</span><input name="nombre" maxlength="120" autocomplete="name" required></label>
        <label class="field" style="margin-top:18px"><span>¿Algo más que quieras contarnos?</span><textarea name="comentarios" maxlength="6000"></textarea></label>
        <button class="btn" id="enviar" type="submit" style="margin-top:22px">Enviar respuestas</button>
        <p id="estado" role="status" aria-live="polite"></p>
      </section>
    </form>
    <section id="gracias" class="card" hidden><h2>¡Gracias! Recibimos tus respuestas.</h2><p>Con esto cerramos el plan. Si te acordás de algo más, podés corregir y volver a enviar.</p><button type="button" class="secondary" id="corregir">Corregir mis respuestas</button></section>
    <noscript>Activá JavaScript para completar la encuesta.</noscript>
  </main>
  <script src="../schema.js"></script><script src="../encuesta.js"></script>
</body>
</html>
