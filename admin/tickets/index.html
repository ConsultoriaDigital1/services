<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tickets — Consultoría Digital</title><link rel="icon" href="../../assets/favicon.png"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../brief/brief.css"><link rel="stylesheet" href="../../tickets/tickets.css"></head>
<body><header class="brief-header"><a href="../">← Panel de tests</a><button type="button" class="secondary" id="logout">Salir</button></header>
<main class="brief-main"><h1>Tickets de clientes</h1>
<form id="login" class="card" hidden><label class="field">Contraseña del panel<input type="password" id="password" autocomplete="current-password" required></label><button class="btn">Entrar</button></form>
<p id="status" role="status" aria-live="polite"></p>
<div id="panel" hidden>
  <form id="nuevo" class="card"><h2>Nuevo proyecto</h2>
    <div class="fields">
      <label class="field"><span>Nombre del proyecto *</span><input id="nuevo-nombre" maxlength="120" required placeholder="Ej.: Web Pino Soluciones"></label>
      <label class="field"><span>Cliente / empresa</span><input id="nuevo-cliente" maxlength="120" placeholder="Ej.: Pino Soluciones"></label>
    </div>
    <p>Se genera un código de acceso de 6 caracteres para pasarle al cliente. El cliente busca el proyecto por su nombre o el del cliente en <a href="../../tickets/" target="_blank" rel="noopener">consultoriadigital.io/tickets</a>.</p>
    <button class="btn">Crear proyecto</button> <span id="nuevo-estado" role="status"></span>
  </form>
  <div class="tk-adm-filtros">
    <input type="search" class="search" id="buscar" placeholder="Buscar en proyectos y pedidos…" aria-label="Buscar">
    <select id="filtro-proyecto" aria-label="Proyecto"><option value="">Todos los proyectos</option></select>
    <select id="filtro-estado" aria-label="Estado"><option value="">Pendientes y hechos</option><option value="pendientes">Solo pendientes</option><option value="hechos">Solo hechos</option></select>
    <label class="check" style="margin:0"><input type="checkbox" id="ver-archivados"> Ver archivados</label>
    <button type="button" class="secondary" id="reload">Actualizar</button>
  </div>
  <div id="proyectos"></div>
</div></main>
<script src="../../tickets/comun.js"></script><script src="./admin.js"></script></body></html>
